<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律评审 Agent</title>
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --surface-2: #faf9f6;
    --border: #e6e3da;
    --border-strong: #d5d1c5;
    --text: #1f2430;
    --text-2: #5b6270;
    --muted: #9097a3;
    --ink: #1e3a5f;            /* 主色：墨蓝 */
    --ink-deep: #162c49;
    --ink-soft: #eef2f7;
    --gold: #b08b3c;           /* 强调：鎏金 */
    --gold-soft: #faf5e8;
    --ok: #3d7a55;
    --ok-soft: #eef6f0;
    --err: #b04438;
    --err-soft: #faeeec;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(31, 42, 64, 0.05);
    --shadow-md: 0 4px 16px rgba(31, 42, 64, 0.08);
    --shadow-lg: 0 16px 48px rgba(22, 32, 56, 0.18);
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
    font-size: 14px; line-height: 1.6;
  }
  ::selection { background: var(--ink); color: #fff; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ===== 顶栏 ===== */
  header {
    height: 58px; padding: 0 24px; flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-deep) 100%);
    color: #fff; display: grid; place-items: center; font-size: 16px;
    box-shadow: var(--shadow-sm);
  }
  .brand h1 { font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  .brand .sub { font-size: 11.5px; color: var(--muted); margin-top: -1px; letter-spacing: 0.04em; }
  header .spacer { flex: 1; }
  .ghost-btn {
    background: none; border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 15px; cursor: pointer; font-size: 13px; color: var(--text-2);
    transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .ghost-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--ink-soft); }

  main { flex: 1; display: flex; min-height: 0; }

  /* ===== 对话区 ===== */
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages {
    flex: 1; overflow-y: auto; padding: 28px max(24px, calc(50% - 430px));
    display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
  }

  /* 空状态 */
  #welcome { margin: auto; text-align: center; max-width: 520px; animation: rise .5s ease; }
  #welcome .seal {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-deep) 100%);
    color: #fff; display: grid; place-items: center; font-size: 30px;
    box-shadow: var(--shadow-md);
  }
  #welcome h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 8px; }
  #welcome p { color: var(--text-2); font-size: 13.5px; margin-bottom: 22px; }
  .suggests { display: flex; flex-direction: column; gap: 9px; }
  .suggest {
    text-align: left; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; cursor: pointer; font-size: 13.5px;
    color: var(--text); transition: all .15s ease; box-shadow: var(--shadow-sm);
    line-height: 1.55;
  }
  .suggest:hover { border-color: var(--ink); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .suggest .hint { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }

  /* 消息气泡 */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg {
    max-width: 76%; padding: 12px 17px; border-radius: var(--radius);
    white-space: pre-wrap; word-break: break-word; animation: rise .3s ease;
  }
  .msg.user {
    align-self: flex-end; color: #fff; border-bottom-right-radius: 5px;
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-deep) 100%);
    box-shadow: var(--shadow-sm);
  }
  .msg.assistant {
    align-self: flex-start; background: var(--surface);
    border: 1px solid var(--border); border-bottom-left-radius: 5px;
    box-shadow: var(--shadow-sm);
  }
  .msg .cursor {
    display: inline-block; width: 2px; height: 16px; background: var(--gold);
    vertical-align: text-bottom; margin-left: 2px; animation: blink .9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 工具/事件胶囊 */
  .tool-chip {
    align-self: flex-start; font-size: 12px; color: var(--text-2);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px; animation: rise .25s ease;
    display: inline-flex; align-items: center; gap: 7px; box-shadow: var(--shadow-sm);
  }
  .tool-chip::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); flex-shrink: 0;
  }
  .tool-chip.running::before { animation: pulse 1.1s ease infinite; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }
  .tool-chip.ok::before { background: var(--ok); }
  .tool-chip.err { color: var(--err); border-color: #e8c8c3; background: var(--err-soft); }
  .tool-chip.err::before { background: var(--err); }

  /* 恢复条 */
  #resume-bar {
    display: none; padding: 11px 24px; font-size: 13px; flex-shrink: 0;
    background: var(--gold-soft); border-top: 1px solid #e7d9b8;
    align-items: center; gap: 14px; color: #6b5519;
  }
  #resume-bar.show { display: flex; animation: rise .25s ease; }
  #resume-bar button {
    background: var(--gold); color: #fff; border: none; border-radius: 9px;
    padding: 7px 18px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: filter .15s; margin-left: auto;
  }
  #resume-bar button:hover { filter: brightness(1.08); }

  /* 输入区 */
  #input-bar {
    padding: 16px max(24px, calc(50% - 430px)) 20px; flex-shrink: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .input-shell {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow-md);
    display: flex; align-items: flex-end; padding: 6px 6px 6px 18px;
    transition: border-color .15s;
  }
  .input-shell:focus-within { border-color: var(--ink); }
  #input {
    flex: 1; resize: none; border: none; background: none; outline: none;
    font-size: 14px; font-family: inherit; line-height: 1.55;
    padding: 9px 0; max-height: 140px; color: var(--text);
  }
  #input::placeholder { color: var(--muted); }
  #pause-btn {
    display: none; border: 1px solid var(--border); background: var(--surface);
    border-radius: 11px; padding: 0 16px; height: 44px; font-size: 13.5px;
    cursor: pointer; color: var(--text-2); transition: all .15s; flex-shrink: 0;
  }
  #pause-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  #send-btn {
    width: 44px; height: 44px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-deep) 100%);
    color: #fff; font-size: 17px; flex-shrink: 0; display: grid; place-items: center;
    transition: all .15s; box-shadow: var(--shadow-sm);
  }
  #send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== 右侧：执行计划 ===== */
  #side-col {
    width: 330px; flex-shrink: 0; border-left: 1px solid var(--border);
    background: var(--surface); display: flex; flex-direction: column; overflow-y: auto;
  }
  .panel-head { padding: 18px 20px 4px; }
  .panel-head .t {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  #routing-info {
    margin: 10px 20px 0; font-size: 12px; color: var(--text-2); line-height: 1.55;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px;
  }
  #plan-goal {
    margin: 12px 20px 4px; font-family: var(--serif); font-size: 14.5px;
    font-weight: 700; line-height: 1.5; display: none;
  }
  #plan-goal.show { display: block; }
  /* 进度 */
  #plan-progress { margin: 10px 20px 2px; display: none; }
  #plan-progress.show { display: block; }
  #plan-progress .nums { font-size: 12px; color: var(--text-2); margin-bottom: 6px;
                          display: flex; justify-content: space-between; }
  #plan-progress .bar { height: 5px; background: var(--ink-soft); border-radius: 99px; overflow: hidden; }
  #plan-progress .fill {
    height: 100%; width: 0; border-radius: 99px; transition: width .4s ease;
    background: linear-gradient(90deg, var(--ink), var(--gold));
  }
  /* 任务卡片（时间线样式） */
  #plan-list { list-style: none; padding: 14px 20px 24px; display: flex; flex-direction: column; }
  .task { position: relative; padding: 0 0 0 30px; }
  .task + .task { margin-top: 4px; }
  .task::before {     /* 连接线 */
    content: ""; position: absolute; left: 10px; top: 26px; bottom: -8px;
    width: 2px; background: var(--border); border-radius: 2px;
  }
  .task:last-child::before { display: none; }
  .task .dot {
    position: absolute; left: 1px; top: 9px; width: 20px; height: 20px;
    border-radius: 50%; display: grid; place-items: center; font-size: 10px;
    background: var(--surface); border: 2px solid var(--border-strong);
    color: var(--muted); font-weight: 600; transition: all .25s ease; z-index: 1;
  }
  .task .card {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 13px;
    margin-bottom: 8px; background: var(--surface); transition: all .25s ease;
  }
  .task .name { font-weight: 600; font-size: 13px; }
  .task .desc { color: var(--text-2); font-size: 12px; margin-top: 3px; line-height: 1.5; }
  .task .deps { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .task.pending .card { opacity: 0.7; }
  .task.running .dot { border-color: var(--gold); color: var(--gold); animation: pulse 1.2s ease infinite; }
  .task.running .card { border-color: #e3cf9d; background: var(--gold-soft); opacity: 1; }
  .task.done .dot { border-color: var(--ok); background: var(--ok); color: #fff; }
  .task.done .card { border-color: #cfe2d5; background: var(--ok-soft); }
  .task.done .name { color: var(--ok); }
  #plan-empty { padding: 28px 20px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.7; }

  /* ===== 调试抽屉 ===== */
  #debug-drawer {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(740px, 92vw);
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(102%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 50; display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
  }
  #debug-drawer.open { transform: translateX(0); }
  #debug-head {
    padding: 15px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #debug-head h2 { font-family: var(--serif); font-size: 16px; flex: 1; }
  #debug-body { flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--surface-2); }
  .trace-meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; font-family: var(--mono); }
  .span-item {
    border: 1px solid var(--border); border-radius: 11px; margin-bottom: 9px;
    overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm);
  }
  .span-head {
    display: flex; gap: 10px; align-items: center; padding: 10px 14px;
    cursor: pointer; font-size: 13px; transition: background .12s;
  }
  .span-head:hover { background: var(--ink-soft); }
  .span-kind {
    font-size: 10.5px; padding: 2.5px 9px; border-radius: 999px; color: #fff;
    letter-spacing: 0.03em; flex-shrink: 0;
  }
  .span-kind.model_request    { background: #4a5fa5; }
  .span-kind.tool_call        { background: var(--ok); }
  .span-kind.routing          { background: var(--gold); }
  .span-kind.planning         { background: var(--ink); }
  .span-kind.checkpoint       { background: var(--err); }
  .span-kind.skill_disclosure { background: #7e57a5; }
  .span-kind.run_lifecycle    { background: #5f6b7a; }
  .span-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .span-dur { color: var(--muted); font-size: 11.5px; font-family: var(--mono); flex-shrink: 0; }
  .span-detail { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--border); }
  .span-item.open .span-detail { display: block; }
  .span-detail h4 {
    font-size: 11.5px; color: var(--muted); margin: 12px 0 5px;
    letter-spacing: 0.05em; font-weight: 600;
  }
  .span-detail pre {
    background: #20242e; color: #dde2ea; border-radius: 9px; padding: 12px 14px;
    font-size: 12px; font-family: var(--mono); line-height: 1.6;
    overflow: auto; white-space: pre-wrap; word-break: break-word; max-height: 400px;
  }

  /* ===== 内联卡点卡片（对话流的一部分） ===== */
  .ckpt-card {
    align-self: flex-start; width: min(560px, 88%);
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--gold); border-radius: var(--radius);
    padding: 14px 17px 13px; animation: rise .3s ease; box-shadow: var(--shadow-md);
  }
  .ckpt-card .ck-head {
    display: flex; align-items: center; gap: 9px; margin-bottom: 8px;
  }
  .ckpt-card .ck-badge {
    font-family: var(--serif); font-weight: 700; font-size: 14px;
  }
  .ckpt-card .ck-kind {
    font-size: 11px; color: var(--muted); font-family: var(--mono);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 9px;
  }
  .ckpt-card .ck-q { font-size: 14px; line-height: 1.65; }
  .ckpt-card details { margin-top: 10px; }
  .ckpt-card summary {
    cursor: pointer; font-size: 12px; color: var(--text-2); user-select: none;
  }
  .ckpt-card summary:hover { color: var(--ink); }
  .ckpt-card details pre {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; font-size: 12px; font-family: var(--mono); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; margin-top: 8px;
    max-height: 220px; overflow-y: auto;
  }
  .ck-options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .opt-card {
    border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px;
    cursor: pointer; transition: all .15s ease; background: var(--surface);
  }
  .opt-card:hover {
    border-color: var(--ink); background: var(--ink-soft);
    transform: translateY(-1px); box-shadow: var(--shadow-md);
  }
  .opt-card .opt-label { font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
  .opt-card .opt-label .rec {
    font-size: 10.5px; color: var(--gold); border: 1px solid var(--gold);
    background: var(--gold-soft); border-radius: 999px; padding: 1px 9px; font-weight: 500;
  }
  .opt-card .opt-desc { color: var(--text-2); font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
  .ck-input {
    width: 100%; margin-top: 11px; border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-family: inherit; font-size: 13px; min-height: 54px;
    resize: vertical; outline: none; transition: border-color .15s; background: var(--surface);
  }
  .ck-input:focus { border-color: var(--ink); }
  .ck-actions { display: flex; gap: 9px; justify-content: flex-end; margin-top: 11px; }
  .ck-actions button {
    border-radius: 9px; padding: 7px 17px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-2); transition: all .15s;
  }
  .ck-actions button:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .ck-actions .reject { color: var(--err); border-color: #e3bfb9; }
  .ck-actions .reject:hover { background: var(--err-soft); }
  .ck-actions .approve {
    background: linear-gradient(135deg, var(--ok), #2e6344); border: none; color: #fff;
  }
  /* 已处理态：选项冻结、操作区收起、状态行展示结论 */
  .ckpt-card.resolved { border-left-color: var(--border-strong); opacity: 0.92; }
  .ckpt-card.resolved .ck-options { pointer-events: none; }
  .ckpt-card.resolved .opt-card { opacity: 0.55; }
  .ckpt-card.resolved .opt-card.chosen {
    opacity: 1; border-color: var(--ink); background: var(--ink-soft);
  }
  .ckpt-card.resolved .ck-input, .ckpt-card.resolved .ck-actions { display: none; }
  .ck-status {
    display: none; margin-top: 11px; padding-top: 10px;
    border-top: 1px dashed var(--border); font-size: 13px; font-weight: 600;
  }
  .ckpt-card.resolved .ck-status { display: block; }
  .ck-status.ok { color: var(--ok); }
  .ck-status.err { color: var(--err); }
  .ck-status.neutral { color: var(--text-2); }

  @media (max-width: 860px) { #side-col { display: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">⚖</div>
    <div>
      <h1>法律评审 Agent</h1>
      <div class="sub">Plan-and-Execute · 控制面 / 数据面解耦</div>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="ghost-btn" id="debug-btn">🔍 链路调试</button>
</header>

<main>
  <div id="chat-col">
    <div id="messages">
      <div id="welcome">
        <div class="seal">⚖</div>
        <h2>开始一次合同审查</h2>
        <p>描述审查需求或选择以下示例，Agent 将自动规划执行图谱并逐步完成审查。</p>
        <div class="suggests">
          <button class="suggest" onclick="useSuggest(this)">帮我审查一份采购合同的违约责任条款
            <span class="hint">基线比对 → 条款解析 → 风险识别 → 修改意见</span></button>
          <button class="suggest" onclick="useSuggest(this)">审查这份技术服务合同的知识产权归属约定是否存在风险
            <span class="hint">涉及人工卡点确认，可体验卡片点选交互</span></button>
          <button class="suggest" onclick="useSuggest(this)">检索保密协议中竞业限制期限的法规上限
            <span class="hint">单一检索请求，走旁路链路</span></button>
        </div>
      </div>
    </div>
    <div id="resume-bar">
      ⏸ 运行已暂停，现场已保存。可在输入框补充指示后恢复。
      <button onclick="resumeRun()">▶ 恢复运行</button>
    </div>
    <div id="input-bar">
      <div class="input-shell">
        <textarea id="input" rows="1"
          placeholder="描述审查需求…（Enter 发送，Shift+Enter 换行）"></textarea>
      </div>
      <button id="pause-btn" onclick="interruptRun()">⏸ 暂停</button>
      <button id="send-btn" title="发送">➤</button>
    </div>
  </div>

  <div id="side-col">
    <div class="panel-head"><span class="t">执行计划</span></div>
    <div id="routing-info">等待任务…</div>
    <div id="plan-goal"></div>
    <div id="plan-progress">
      <div class="nums"><span>子任务进度</span><span id="plan-nums">0 / 0</span></div>
      <div class="bar"><div class="fill" id="plan-fill"></div></div>
    </div>
    <ul id="plan-list"><div id="plan-empty">发起审查后，任务清单<br>将在这里逐步点亮</div></ul>
  </div>
</main>

<div id="debug-drawer">
  <div id="debug-head">
    <h2>链路观测</h2>
    <button class="ghost-btn" onclick="loadTrace()">刷新</button>
    <button class="ghost-btn" onclick="document.getElementById('debug-drawer').classList.remove('open')">关闭</button>
  </div>
  <div id="debug-body"><p style="color:var(--muted);font-size:13px;">运行一次任务后查看链路。</p></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let currentRunId = null;
let suspendedRunId = null;
let streamingEl = null;
let streamedThisRun = false;   // 本轮是否已流式输出过正文（final 去重用）
let planTotal = 0, planDone = 0;
let thinkingChip = null, thinkingChars = 0;

// ---------- 鉴权（服务端设置 LRA_SERVER_TOKEN 时启用） ----------

let apiToken = localStorage.getItem('lra_token') || '';
async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers,
    apiToken ? {'X-API-Token': apiToken} : {});
  let resp = await fetch(path, opts);
  if (resp.status === 401) {
    const entered = prompt('服务端已启用鉴权，请输入 API Token：');
    if (entered) {
      apiToken = entered.trim();
      localStorage.setItem('lra_token', apiToken);
      opts.headers['X-API-Token'] = apiToken;
      resp = await fetch(path, opts);
    }
  }
  return resp;
}
function sseUrl(path) {
  return apiToken ? `${path}?token=${encodeURIComponent(apiToken)}` : path;
}

// ---------- 中断 / 恢复 ----------

async function interruptRun() {
  if (!currentRunId) return;
  $('pause-btn').disabled = true;
  await api(`/api/runs/${currentRunId}/interrupt`, {method: 'POST'});
  // 实际挂起以 interrupted 事件为准（引擎在安全点才停）
}

async function resumeRun() {
  if (!suspendedRunId) return;
  const supplement = $('input').value.trim() || null;
  $('input').value = '';
  autoGrow();
  $('resume-bar').classList.remove('show');
  const resp = await api(`/api/runs/${suspendedRunId}/resume`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({supplement}),
  });
  if (!resp.ok) { addChip('恢复失败：' + (await resp.text()), true); return; }
  currentRunId = suspendedRunId;
  suspendedRunId = null;
  setRunning(true);
  listen(currentRunId);
}

function setRunning(running) {
  $('send-btn').disabled = running;
  $('pause-btn').style.display = running ? 'block' : 'none';
  $('pause-btn').disabled = false;
}

// ---------- 对话 ----------

function clearWelcome() {
  const w = $('welcome');
  if (w) w.remove();
}
function useSuggest(el) {
  $('input').value = el.childNodes[0].textContent.trim();
  send();
}
function addMsg(role, text) {
  clearWelcome();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  $('messages').appendChild(el);
  scrollBottom();
  return el;
}
function addChip(text, isErr, chipId) {
  clearWelcome();
  const el = document.createElement('div');
  el.className = 'tool-chip' + (isErr ? ' err' : '');
  el.textContent = text;
  if (chipId) el.id = chipId;
  $('messages').appendChild(el);
  scrollBottom();
  return el;
}
function scrollBottom() { $('messages').scrollTop = $('messages').scrollHeight; }

async function send() {
  const text = $('input').value.trim();
  if (!text || currentRunId) return;
  $('input').value = '';
  autoGrow();
  setRunning(true);
  suspendedRunId = null;
  $('resume-bar').classList.remove('show');
  addMsg('user', text);
  streamedThisRun = false;
  resetPlan();

  const resp = await api('/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, session_id: 'web'}),
  });
  const {run_id} = await resp.json();
  currentRunId = run_id;
  listen(run_id);
}

function listen(runId) {
  const es = new EventSource(sseUrl(`/api/runs/${runId}/events`));
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev, es);
  };
  es.onerror = () => { es.close(); finishRun(); };
}

function handleEvent(ev, es) {
  switch (ev.type) {
    case 'routing':
      $('routing-info').textContent = `意图：${ev.intent}（置信度 ${(ev.confidence*100).toFixed(0)}%）— ${ev.reason}`;
      break;
    case 'plan': renderPlan(ev); break;
    case 'task_status': setTaskStatus(ev.task_id, ev.status); break;
    case 'thinking_delta':
      thinkingChars += ev.chars;
      if (!thinkingChip) {
        thinkingChip = addChip('', false);
        thinkingChip.classList.add('running');
      }
      thinkingChip.textContent = `🧠 模型思考中… ${thinkingChars} 字`;
      break;
    case 'text_delta':
      finishThinking();
      streamedThisRun = true;
      if (!streamingEl) {
        streamingEl = addMsg('assistant', '');
        streamingEl.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
      }
      streamingEl.querySelector('.cursor').insertAdjacentText('beforebegin', ev.text);
      scrollBottom();
      break;
    case 'tool_start':
      finishThinking();
      flushStream();
      addChip(`${ev.tool_name} 调用中…`, false, `chip-${ev.tool_use_id}`)
        .classList.add('running');
      break;
    case 'tool_end': {
      const chip = document.getElementById(`chip-${ev.tool_use_id}`);
      const label = ev.is_error ? `${ev.tool_name} 失败` : `${ev.tool_name} 完成`;
      if (chip) {
        chip.textContent = label;
        chip.classList.remove('running');
        chip.classList.toggle('err', ev.is_error);
        chip.classList.toggle('ok', !ev.is_error);
      } else addChip(label, ev.is_error);
      break;
    }
    case 'skill_disclosure':
      addChip(`📚 ${ev.skill_name} 指南已披露（${ev.level} · ${ev.trigger} · ~${ev.est_tokens} tok）`);
      break;
    case 'checkpoint': renderCheckpointCard(ev); break;
    case 'checkpoint_resolved':
      // 兜底：本端未处理而后端已决议（超时自动驳回/其他端处理）时同步卡片状态
      markCkptResolved(ev.checkpoint_id,
                       ev.action === 'reject' ? 'timeout' : ev.action);
      break;
    case 'interrupted':
      flushStream();
      markAllCkptsInterrupted();
      suspendedRunId = ev.run_id;
      addChip(`⏸ 已在第 ${ev.iteration + 1} 轮暂停，现场已保存`);
      $('resume-bar').classList.add('show');
      break;
    case 'resumed':
      addChip(`▶ 已从第 ${ev.iteration + 1} 轮恢复运行`);
      break;
    case 'final':
      finishThinking();
      flushStream();
      // 流式已经展示过正文则不再重复气泡；短路/旁路（无流式）场景直接展示
      if (!streamedThisRun && ev.text) addMsg('assistant', ev.text);
      break;
    case 'error':
      flushStream();
      addChip(`运行异常：${ev.message}`, true);
      break;
    case 'done':
      es.close();
      finishRun();
      break;
  }
}

function finishThinking() {
  if (thinkingChip) {
    thinkingChip.textContent = `🧠 思考完成（${thinkingChars} 字）`;
    thinkingChip.classList.remove('running');
    thinkingChip.classList.add('ok');
    thinkingChip = null;
  }
  thinkingChars = 0;
}
function flushStream() {
  if (streamingEl) {
    const c = streamingEl.querySelector('.cursor');
    if (c) c.remove();
    if (!streamingEl.textContent.trim()) streamingEl.remove();
    streamingEl = null;
  }
}
function finishRun() {
  flushStream();
  setRunning(false);
  if (currentRunId) loadTrace(currentRunId);
  currentRunId = null;
}

// ---------- 任务清单 ----------

function resetPlan() {
  $('plan-goal').textContent = '';
  $('plan-goal').classList.remove('show');
  $('plan-progress').classList.remove('show');
  $('plan-list').innerHTML = '<div id="plan-empty">规划中…</div>';
  $('routing-info').textContent = '路由中…';
  planTotal = 0; planDone = 0;
}
function renderPlan(ev) {
  $('plan-goal').textContent = '🎯 ' + ev.goal;
  $('plan-goal').classList.add('show');
  $('plan-list').innerHTML = '';
  planTotal = ev.tasks.length; planDone = 0;
  updateProgress();
  $('plan-progress').classList.add('show');
  ev.tasks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'task pending';
    li.id = 'task-' + t.id;
    li.innerHTML = `<span class="dot">${i + 1}</span><div class="card">
        <div class="name">${esc(t.name)}</div>
        <div class="desc">${esc(t.description)}</div>
        ${t.depends_on.length ? `<div class="deps">依赖: ${t.depends_on.join(', ')}</div>` : ''}
      </div>`;
    $('plan-list').appendChild(li);
  });
}
function setTaskStatus(taskId, status) {
  const li = $('task-' + taskId);
  if (!li) return;
  const wasDone = li.classList.contains('done');
  li.className = 'task ' + status;
  const dot = li.querySelector('.dot');
  if (status === 'done') { dot.textContent = '✓'; if (!wasDone) planDone++; }
  else if (status === 'running') dot.textContent = '·';
  updateProgress();
}
function updateProgress() {
  $('plan-nums').textContent = `${planDone} / ${planTotal}`;
  $('plan-fill').style.width = planTotal ? `${(planDone / planTotal) * 100}%` : '0';
}
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// ---------- HITL 卡点（对话流内联卡片） ----------

const pendingCkpts = {};   // checkpoint_id → 卡片元素

function renderCheckpointCard(ev) {
  finishThinking();
  flushStream();
  const isAsk = ev.kind === 'ask_user';
  const card = document.createElement('div');
  card.className = 'ckpt-card';
  card.dataset.ckptId = ev.checkpoint_id;

  const badge = isAsk ? '🙋 Agent 追问' : '🛑 待人工确认';
  const question = ev.question || (isAsk ? '' : '请审阅以下中间结论，确认后继续执行：');
  card.innerHTML = `
    <div class="ck-head">
      <span class="ck-badge">${badge}</span>
      ${isAsk ? '' : `<span class="ck-kind">${esc(ev.kind)}</span>`}
    </div>
    <div class="ck-q">${esc(question)}</div>
    ${isAsk ? '' : `<details open><summary>查看中间结论</summary><pre>${esc(JSON.stringify(ev.payload, null, 2))}</pre></details>`}
    <div class="ck-options"></div>
    <textarea class="ck-input" placeholder="${isAsk ? '或直接输入回答…' : '修改意见 / 驳回原因（可选）…'}"></textarea>
    <div class="ck-actions"></div>
    <div class="ck-status"></div>`;

  // 备选项卡片
  const optBox = card.querySelector('.ck-options');
  for (const opt of (ev.options || [])) {
    const el = document.createElement('div');
    el.className = 'opt-card';
    el.innerHTML = `
      <div class="opt-label">${esc(opt.label)}${opt.recommended ? '<span class="rec">推荐</span>' : ''}</div>
      ${opt.description ? `<div class="opt-desc">${esc(opt.description)}</div>` : ''}`;
    el.onclick = () => {
      el.classList.add('chosen');
      submitCkpt(card, opt.action,
                 {answer: opt.label, option_id: opt.id},
                 card.querySelector('.ck-input').value.trim(), opt.label);
    };
    optBox.appendChild(el);
  }

  // 操作按钮：追问 → 提交回答；审查卡点 → 驳回 / 提交意见
  const actions = card.querySelector('.ck-actions');
  const mkBtn = (label, cls, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = fn;
    actions.appendChild(b);
  };
  const inputOf = () => card.querySelector('.ck-input').value.trim();
  if (isAsk) {
    mkBtn('提交回答', 'approve', () => {
      const text = inputOf() || '（用户未填写）';
      submitCkpt(card, 'answer', {answer: text}, '', text);
    });
  } else {
    mkBtn('驳回', 'reject', () =>
      submitCkpt(card, 'reject', null, inputOf(), '驳回' + (inputOf() ? '：' + inputOf() : '')));
    mkBtn('提交意见', '', () => {
      const text = inputOf() || '（用户未填写）';
      submitCkpt(card, 'answer', {answer: text}, '', text);
    });
  }

  // 回车提交（Shift+Enter 换行）
  card.querySelector('.ck-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = inputOf();
      if (text) submitCkpt(card, 'answer', {answer: text}, '', text);
    }
  });

  pendingCkpts[ev.checkpoint_id] = card;
  clearWelcome();
  $('messages').appendChild(card);
  scrollBottom();
  card.querySelector('.ck-input').focus();
}

async function submitCkpt(card, action, payload, comment, echoText) {
  if (card.classList.contains('resolved')) return;
  markCkptResolved(card.dataset.ckptId, action, echoText);
  if (echoText) addMsg('user', echoText);   // 用户的选择回显为对话流中的用户气泡
  await api(`/api/checkpoints/${card.dataset.ckptId}/resolve`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action, payload, comment: comment || ''}),
  });
}

function markCkptResolved(ckptId, action, detail) {
  const card = pendingCkpts[ckptId];
  if (!card || card.classList.contains('resolved')) return;
  card.classList.add('resolved');
  const det = card.querySelector('details');
  if (det) det.open = false;
  const status = card.querySelector('.ck-status');
  const map = {
    approve:     ['ok', '✓ 已批准'],
    reject:      ['err', '✗ 已驳回'],
    answer:      ['ok', '↩ 已回答' + (detail ? '：' + detail : '')],
    interrupted: ['neutral', '⏸ 运行中断，卡点未处理'],
    timeout:     ['err', '⏱ 等待超时，自动驳回'],
  };
  const [cls, text] = map[action] || ['neutral', '已处理（' + action + '）'];
  status.classList.add(cls);
  status.textContent = text;
  delete pendingCkpts[ckptId];
}

function markAllCkptsInterrupted() {
  for (const id of Object.keys(pendingCkpts)) markCkptResolved(id, 'interrupted');
}

// ---------- 链路调试 ----------

$('debug-btn').onclick = () => {
  $('debug-drawer').classList.toggle('open');
  loadTrace();
};
let lastTraceRunId = null;
async function loadTrace(runId) {
  if (runId) lastTraceRunId = runId;
  if (!lastTraceRunId) {
    const runs = await (await api('/api/runs')).json();
    if (!runs.length) return;
    lastTraceRunId = runs[0].run_id;
  }
  const trace = await (await api(`/api/runs/${lastTraceRunId}/trace`)).json();
  renderTrace(trace);
}
function renderTrace(trace) {
  const body = $('debug-body');
  body.innerHTML = `<p class="trace-meta">run_id: ${trace.run_id} · ${trace.spans.length} spans</p>`;
  for (const span of trace.spans) {
    const item = document.createElement('div');
    item.className = 'span-item';
    const sections = renderSpanDetail(span);
    item.innerHTML = `
      <div class="span-head">
        <span class="span-kind ${span.kind}">${span.kind}</span>
        <span class="span-name">${esc(span.name)}</span>
        <span class="span-dur">${span.duration_ms != null ? span.duration_ms + ' ms' : ''}</span>
      </div>
      <div class="span-detail">${sections}</div>`;
    item.querySelector('.span-head').onclick = () => item.classList.toggle('open');
    body.appendChild(item);
  }
}
function renderSpanDetail(span) {
  const p = span.payload || {};
  let html = '';
  if (p.system) html += section('System（组装后的系统提示词）', p.system);
  if (p.messages) html += section('Messages（组装后的对话上下文）', p.messages);
  if (p.tool_schemas) html += section('Tools（本轮加载的工具 Schema）', p.tool_schemas);
  if (p.instruction) html += section('下发指令 (ToolInstruction)', p.instruction);
  if (p.result !== undefined) html += section('执行结果', p.result);
  if (p.response_content) html += section('模型响应', p.response_content);
  if (p.usage) html += section('Token 用量', p.usage);
  const rest = Object.fromEntries(Object.entries(p).filter(([k]) =>
    !['system','messages','tool_schemas','instruction','result','response_content','usage'].includes(k)));
  if (Object.keys(rest).length) html += section('其他', rest);
  return html || '<p style="color:var(--muted);font-size:12px;padding-top:10px;">无详情</p>';
}
function section(title, data) {
  const text = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
  return `<h4>${title}</h4><pre>${esc(text)}</pre>`;
}

// ---------- 输入 ----------

function autoGrow() {
  const el = $('input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}
$('input').addEventListener('input', autoGrow);
$('send-btn').onclick = send;
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
